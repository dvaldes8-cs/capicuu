<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Capicuu">
  <!-- Tilted 3|2 domino tile -->
  <g transform="rotate(-12 64 64)">
    <rect x="28" y="18" width="72" height="92" rx="14" fill="#123D32" stroke="#D4A956" stroke-width="4"/>
    <line x1="28" y1="64" x2="100" y2="64" stroke="#D4A956" stroke-width="3" stroke-linecap="round"/>
    <!-- Top: 3 pips -->
    <circle cx="48" cy="34" r="6" fill="#F8F5ED"/>
    <circle cx="80" cy="34" r="6" fill="#F8F5ED"/>
    <circle cx="64" cy="48" r="6" fill="#F8F5ED"/>
    <!-- Bottom: 2 pips -->
    <circle cx="48" cy="80" r="6" fill="#F8F5ED"/>
    <circle cx="80" cy="94" r="6" fill="#F8F5ED"/>
  </g>
</svg>
